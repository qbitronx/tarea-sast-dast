# Configuración base compartida — las propiedades específicas de cada
# proyecto (key, name, sources) se pasan por línea de comandos en el Makefile.

sonar.projectVersion=1.0

# Exclusiones comunes
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**

# Extensiones JavaScript / JSX
sonar.javascript.file.suffixes=.js,.jsx
